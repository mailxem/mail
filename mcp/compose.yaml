services:
  mcp:
    image: ${MCP_IMAGE:-ghcr.io/mailxem/mcp:main}
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      XEM_MCP_PUBLIC_URL: https://${MCP_DOMAIN:-mcp.xem.email}/mcp
      XEM_API_BASE_URL: ${XEM_API_BASE_URL:-https://api.xem.email/api/v1}
      XEM_MCP_ALLOWED_ORIGINS: ${XEM_MCP_ALLOWED_ORIGINS:-}
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 100
    stop_grace_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      mcp:
        condition: service_healthy
    environment:
      MCP_DOMAIN: ${MCP_DOMAIN:-mcp.xem.email}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
