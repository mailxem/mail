definitions:
  internal_handlers.AudienceInsights:
    properties:
      behaviors:
        additionalProperties:
          $ref: '#/definitions/internal_handlers.BehaviorMetrics'
        type: object
      demographics:
        additionalProperties:
          type: integer
        type: object
      preferences:
        additionalProperties:
          $ref: '#/definitions/internal_handlers.PreferenceMetrics'
        type: object
      segments:
        items:
          $ref: '#/definitions/internal_handlers.AudienceSegment'
        type: array
    type: object
  internal_handlers.AudienceSegment:
    properties:
      clickRate:
        type: number
      growth:
        type: number
      name:
        type: string
      openRate:
        type: number
      size:
        type: integer
    type: object
  internal_handlers.BehaviorMetrics:
    properties:
      count:
        type: integer
      engagementRate:
        type: number
      trend:
        type: string
    type: object
  internal_handlers.CampaignSummary:
    properties:
      campaignId:
        type: string
      clickRate:
        type: number
      engagementScore:
        type: number
      name:
        type: string
      openRate:
        type: number
    type: object
  internal_handlers.ClickPoint:
    properties:
      count:
        type: integer
      element:
        type: string
      x:
        type: integer
      "y":
        type: integer
    type: object
  internal_handlers.ClickSegment:
    properties:
      clickRate:
        type: number
      count:
        type: integer
      selector:
        type: string
    type: object
  internal_handlers.ContactEventInput:
    properties:
      contactId:
        type: string
      email:
        example: ada@example.com
        type: string
      event:
        example: trial_started
        type: string
      listId:
        description: ListID creates the contact in this list when no contact there
          has the email.
        type: string
      properties:
        additionalProperties: true
        type: object
    type: object
  internal_handlers.CreateSubscriptionRequest:
    properties:
      product_id:
        type: string
    required:
    - product_id
    type: object
  internal_handlers.EmailAnalytics:
    description: Email analytics data
    properties:
      acceptedMessages:
        type: integer
      averageReadTime:
        allOf:
        - $ref: '#/definitions/time.Duration'
        description: Average time between open and click
      botClicks:
        type: integer
      botOpens:
        description: "\U0001F916 Machine events left out of every count above"
        type: integer
      bounceCount:
        type: integer
      browserBreakdown:
        additionalProperties:
          type: integer
        type: object
      cityBreakdown:
        additionalProperties:
          type: integer
        type: object
      clickCount:
        type: integer
      clickRate:
        type: number
      clickToOpenRate:
        type: number
      clickedLinks:
        description: "\U0001F517 Link Analytics"
        items:
          $ref: '#/definitions/internal_handlers.LinkAnalytics'
        type: array
      complaintCount:
        type: integer
      dayOfWeekBreakdown:
        additionalProperties:
          type: integer
        description: Day name -> count
        type: object
      deviceBreakdown:
        additionalProperties:
          type: integer
        description: "\U0001F4F1 Device & Browser Analytics"
        type: object
      engagementScore:
        description: "\U0001F3AF Engagement Metrics"
        type: number
      firstOpenTime:
        allOf:
        - $ref: '#/definitions/time.Duration'
        description: Time to first open
      geoBreakdown:
        additionalProperties:
          type: integer
        description: "\U0001F30D Geographic Analytics"
        type: object
      hourlyBreakdown:
        additionalProperties:
          type: integer
        description: Hour (0-23) -> count
        type: object
      industryAvgClickRate:
        type: number
      industryAvgOpenRate:
        description: "\U0001F4C8 Comparative Metrics"
        type: number
      openCount:
        description: "\U0001F4CA Basic Metrics"
        type: integer
      openRate:
        type: number
      osBreakdown:
        additionalProperties:
          type: integer
        type: object
      proxyOpens:
        type: integer
      regionBreakdown:
        additionalProperties:
          type: integer
        type: object
      repeatClicks:
        description: Number of times same user clicked
        type: integer
      repeatOpens:
        description: "\U0001F504 Retention Metrics"
        type: integer
      timelineData:
        description: ⏰ Time-based Analytics
        items:
          $ref: '#/definitions/internal_handlers.TimelineDataPoint'
        type: array
      uniqueClicks:
        type: integer
      uniqueOpens:
        type: integer
      untracked:
        description: sent without open/click tracking; excluded from rates
        type: integer
    type: object
  internal_handlers.GetPlansResponse:
    properties:
      plans:
        items:
          $ref: '#/definitions/kori_internal_models.Product'
        type: array
    type: object
  internal_handlers.GoogleAuthRequest:
    properties:
      access_token:
        type: string
    required:
    - access_token
    type: object
  internal_handlers.HeatmapData:
    properties:
      clicks:
        items:
          $ref: '#/definitions/internal_handlers.ClickPoint'
        type: array
      segments:
        items:
          $ref: '#/definitions/internal_handlers.ClickSegment'
        type: array
      url:
        type: string
    type: object
  internal_handlers.InviteUserRequest:
    description: Send an invitation email to a user to join a team
    properties:
      email:
        type: string
      name:
        minLength: 2
        type: string
      role:
        default: MEMBER
        enum:
        - MEMBER
        - ADMIN
        - SUPER_ADMIN
        type: string
    required:
    - email
    - name
    - role
    type: object
  internal_handlers.LinkAnalytics:
    properties:
      averageTimeToClick:
        $ref: '#/definitions/time.Duration'
      clickCount:
        type: integer
      clickRate:
        type: number
      deviceBreakdown:
        additionalProperties:
          type: integer
        type: object
      firstClickTime:
        type: string
      lastClickTime:
        type: string
      uniqueClicks:
        type: integer
      url:
        type: string
    type: object
  internal_handlers.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  internal_handlers.MonthlyEngagement:
    properties:
      clickRate:
        type: number
      month:
        type: string
      openRate:
        type: number
      totalEmails:
        type: integer
    type: object
  internal_handlers.PerformerMetrics:
    properties:
      engagementRate:
        type: number
      sampleSize:
        type: integer
      type:
        description: subject, template, time, etc.
        type: string
      value:
        type: string
    type: object
  internal_handlers.PreferenceMetrics:
    properties:
      confidence:
        type: number
      count:
        type: integer
      score:
        type: number
    type: object
  internal_handlers.RegisterRequest:
    properties:
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - first_name
    - last_name
    - password
    type: object
  internal_handlers.ResetPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  internal_handlers.SendEmailRequest:
    properties:
      attachments:
        items:
          $ref: '#/definitions/kori_internal_models.MailAttachment'
        type: array
      bcc:
        type: string
      cc:
        type: string
      data:
        items:
          type: integer
        type: array
      html:
        type: string
      inReplyTo:
        type: string
      provider:
        enum:
        - CUSTOM
        - GMAIL
        - OUTLOOK
        - AMAZON
        type: string
      replyTo:
        type: string
      requestId:
        type: string
      scheduleAt:
        type: string
      smtpConfigId:
        type: string
      subject:
        type: string
      templateId:
        type: string
      test:
        type: boolean
      to:
        type: string
    required:
    - data
    - to
    type: object
  internal_handlers.TeamOverview:
    properties:
      averageClickRate:
        type: number
      averageOpenRate:
        type: number
      deviceStats:
        additionalProperties:
          type: integer
        type: object
      geoStats:
        additionalProperties:
          type: integer
        type: object
      monthlyStats:
        items:
          $ref: '#/definitions/internal_handlers.MonthlyEngagement'
        type: array
      topCampaigns:
        items:
          $ref: '#/definitions/internal_handlers.CampaignSummary'
        type: array
      topPerformers:
        items:
          $ref: '#/definitions/internal_handlers.PerformerMetrics'
        type: array
      totalClicks:
        type: integer
      totalEmails:
        type: integer
      totalOpens:
        type: integer
    type: object
  internal_handlers.TimelineDataPoint:
    properties:
      browser:
        type: string
      count:
        type: integer
      country:
        type: string
      deviceType:
        type: string
      eventType:
        type: string
      timestamp:
        type: string
      uniqueCount:
        type: integer
    type: object
  internal_handlers.VerifyResetCodeRequest:
    properties:
      code:
        type: string
      new_password:
        minLength: 8
        type: string
    required:
    - code
    - new_password
    type: object
  internal_handlers.trendPoint:
    properties:
      clickCount:
        type: integer
      devices:
        additionalProperties:
          type: integer
        type: object
      engagementRate:
        type: number
      events:
        items:
          $ref: '#/definitions/kori_internal_models.EmailTracking'
        type: array
      growth:
        type: number
      locations:
        additionalProperties:
          type: integer
        type: object
      openCount:
        type: integer
      period:
        type: string
    type: object
  kori_internal_models.ABTest:
    properties:
      autoDeclareWinner:
        description: Automatically declare winner when threshold met
        type: boolean
      automation:
        $ref: '#/definitions/kori_internal_models.Automation'
      automationID:
        type: string
      campaign:
        $ref: '#/definitions/kori_internal_models.Campaign'
      campaignID:
        type: string
      confidenceThreshold:
        description: 95% confidence
        type: number
      createdAt:
        type: string
      description:
        type: string
      endedAt:
        type: string
      id:
        type: string
      isDeleted:
        default: false
        type: boolean
      minimumSampleSize:
        description: Minimum sends per variant
        type: integer
      name:
        type: string
      startedAt:
        type: string
      status:
        $ref: '#/definitions/kori_internal_models.TestStatus'
      team:
        $ref: '#/definitions/kori_internal_models.Team'
      teamID:
        type: string
      testType:
        $ref: '#/definitions/kori_internal_models.TestType'
      updatedAt:
        type: string
      variants:
        items:
          $ref: '#/definitions/kori_internal_models.TestVariant'
        type: array
      winnerMetric:
        $ref: '#/definitions/kori_internal_models.WinnerMetric'
      winnerVariant:
        $ref: '#/definitions/kori_internal_models.TestVariant'
      winnerVariantID:
        type: string
    type: object
  kori_internal_models.APIKey:
    properties:
      createdAt:
        type: string
      expiresAt:
        type: string
      id:
        type: string
      isDeleted:
        default: false
        type: boolean
      key:
        type: string
      lastUsedAt:
        type: string
      name:
        type: string
      permissions:
        items:
          $ref: '#/definitions/kori_internal_models.APIKeyPermission'
        type: array
      team:
        $ref: '#/definitions/kori_internal_models.Team'
      teamId:
        type: string
      updatedAt:
        type: string
    required:
    - teamId
    type: object
  kori_internal_models.APIKeyPermission:
    properties:
      createdAt:
        type: string
      id:
        type: string
      isDeleted:
        default: false
        type: boolean
      key:
        $ref: '#/definitions/kori_internal_models.APIKey'
      keyId:
        type: string
      resourcePermission:
        $ref: '#/definitions/kori_internal_models.ResourcePermission'
      resourcePermissionId:
        type: string
      updatedAt:
        type: string
    type: object
  kori_internal_models.Automation:
    properties:
      createdAt:
        type: string
      description:
        type: string
      edges:
        items:
          $ref: '#/definitions/kori_internal_models.AutomationNodeEdge'
        type: array
      exitOnGoal:
        description: ExitOnGoal makes a contact leave when they reach one of the workflow's
          goals; nil means yes.
        type: boolean
      hasDraft:
        type: boolean
      id:
        type: string
      isActive:
        type: boolean
      isDeleted:
        default: false
        type: boolean
      liveVersion:
        description: Nodes and Edges hold the draft; LiveVersion names the published
          snapshot new contacts start on.
        type: integer
      name:
        type: string
      nodes:
        items:
          $ref: '#/definitions/kori_internal_models.AutomationNode'
        type: array
      reentryDays:
        type: integer
      reentryMode:
        description: ReentryMode is "once", "after_finish" or "after_days"; empty
          (older workflows) behaves as "after_finish".
        type: string
      sendWindow:
        description: null uses the workspace default
        items:
          type: integer
        type: array
      team:
        $ref: '#/definitions/kori_internal_models.Team'
      teamId:
        type: string
      triggerEvent:
        type: string
      updatedAt:
        type: string
    type: object
  kori_internal_models.AutomationExecution:
    properties:
      automation:
        $ref: '#/definitions/kori_internal_models.Automation'
      automationId:
        type: string
      completedAt:
        type: string
      contact:
        $ref: '#/definitions/kori_internal_models.Contact'
      contactId:
        type: string
      createdAt:
        type: string
      currentNode:
        $ref: '#/definitions/kori_internal_models.AutomationNode'
      currentNodeId:
        type: string
      error:
        type: string
      executionLog:
        items:
          type: integer
        type: array
      exitReason:
        type: string
      id:
        type: string
      isDeleted:
        default: false
        type: boolean
      startedAt:
        type: string
      status:
        $ref: '#/definitions/kori_internal_models.ExecutionStatus'
      triggerData:
        items:
          type: integer
        type: array
      triggerType:
        type: string
      updatedAt:
        type: string
      variables:
        items:
          type: integer
        type: array
      version:
        type: integer
    type: object
  kori_internal_models.AutomationGoal:
    properties:
      automation:
        $ref: '#/definitions/kori_internal_models.Automation'
      automationID:
        type: string
      conversions:
        items:
          $ref: '#/definitions/kori_internal_models.GoalConversion'
        type: array
      createdAt:
        type: string
      description:
        type: string
      goalType:
        $ref: '#/definitions/kori_internal_models.GoalType'
      id:
        type: string
      isActive:
        description: Can be disabled without deletion
        type: boolean
      isDeleted:
        default: false
        type: boolean
      metadata:
        items:
          type: integer
        type: array
      name:
        type: string
      targetValue:
        description: For revenue/conversion rate targets
        type: number
      updatedAt:
        type: string
    type: object
  kori_internal_models.AutomationGoalSummary:
    properties:
      automationId:
        type: string
      conversionRate:
        type: number
      goals:
        items:
          $ref: '#/definitions/kori_internal_models.GoalStats'
        type: array
      totalConversions:
        type: integer
      totalExecutions:
        type: integer
      totalRevenue:
        type: number
    type: object
  kori_internal_models.AutomationNode:
    properties:
      automation:
        $ref: '#/definitions/kori_internal_models.Automation'
      automationId:
        type: string
      createdAt:
        type: string
      data:
        items:
          type: integer
        type: array
      edgesFrom:
        items:
          $ref: '#/definitions/kori_internal_models.AutomationNodeEdge'
        type: array
      edgesTo:
        items:
          $ref: '#/definitions/kori_internal_models.AutomationNodeEdge'
        type: array
      id:
        type: string
      isDeleted:
        default: false
        type: boolean
      type:
        allOf:
        - $ref: '#/definitions/kori_internal_models.NodeType'
        enum:
        - EMAIL_WRITER
      updatedAt:
        type: string
    required:
    - data
    - type
    type: object
  kori_internal_models.AutomationNodeEdge:
    properties:
      animated:
        type: boolean
      automation:
        $ref: '#/definitions/kori_internal_models.Automation'
      automationId:
        type: string
      createdAt:
        type: string
      id:
        type: string
      isDeleted:
        default: false
        type: boolean
      label:
        type: string
      source:
        $ref: '#/definitions/kori_internal_models.AutomationNode'
      sourceId:
        type: string
      target:
        $ref: '#/definitions/kori_internal_models.AutomationNode'
      targetId:
        type: string
      updatedAt:
        type: string
    type: object
  kori_internal_models.BrandingSettings:
    properties:
      createdAt:
        type: string
      dashboardName:
        type: string
      id:
        type: string
      isDeleted:
        default: false
        type: boolean
      logoUrl:
        type: string
      updatedAt:
        type: string
    type: object
  kori_internal_models.Campaign:
    properties:
      analytics:
        items:
          $ref: '#/definitions/kori_internal_models.EmailTracking'
        type: array
      archiveNewsletterId:
        description: ArchiveNewsletterID publishes a one-off campaign in that newsletter's
          web archive.
        type: string
      batchDelay:
        allOf:
        - $ref: '#/definitions/kori_internal_models.Duration'
        description: nanoseconds between batches
      batchSize:
        type: integer
      createdAt:
        type: string
      cronExpression:
        type: string
      data:
        items:
          type: integer
        type: array
      description:
        type: string
      htmlBody:
        type: string
      id:
        type: string
      isDeleted:
        default: false
        type: boolean
      list:
        $ref: '#/definitions/kori_internal_models.MailingList'
      listId:
        type: string
      name:
        type: string
      newsletterId:
        type: string
      nextStageAt:
        type: string
      pauseReason:
        description: PauseReason says why staged sending paused the campaign.
        type: string
      postalAddress:
        type: string
      processed:
        type: integer
      recurringSchedule:
        $ref: '#/definitions/kori_internal_models.CampaignRecurringSchedule'
      schedule:
        $ref: '#/definitions/kori_internal_models.CampaignSchedule'
      scheduledFor:
        type: string
      sendInStages:
        description: 'SendInStages: nil sends in stages automatically to never-mailed
          lists.'
        type: boolean
      sentEmails:
        items:
          $ref: '#/definitions/kori_internal_models.Email'
        type: array
      smtpConfig:
        $ref: '#/definitions/kori_internal_models.SMTPConfig'
      smtpConfigId:
        type: string
      stage:
        description: |-
          Stage counts staged-sending stages cleared; NextStageAt is when the
          next stage's results check is due.
        type: integer
      status:
        $ref: '#/definitions/kori_internal_models.CampaignStatus'
      subject:
        type: string
      team:
        $ref: '#/definitions/kori_internal_models.Team'
      teamId:
        type: string
      template:
        $ref: '#/definitions/kori_internal_models.Template'
      templateId:
        type: string
      timezone:
        type: string
      trackEngagement:
        description: 'TrackEngagement: nil or true adds the open pixel and click-tracking
          links.'
        type: boolean
      updatedAt:
        type: string
    type: object
  kori_internal_models.CampaignRecurringSchedule:
    enum:
    - DAILY
    - WEEKLY
    - MONTHLY
    - CUSTOM
    type: string
    x-enum-varnames:
    - CampaignRecurringScheduleDaily
    - CampaignRecurringScheduleWeekly
    - CampaignRecurringScheduleMonthly
    - CampaignRecurringScheduleCustom
  kori_internal_models.CampaignSchedule:
    enum:
    - ONE_TIME
    - RECURRING
    type: string
    x-enum-varnames:
    - CampaignScheduleOneTime
    - CampaignScheduleRecurring
  kori_internal_models.CampaignStatus:
    enum:
    - DRAFT
    - SCHEDULED
    - SENDING
    - COMPLETED
    - FAILED
    - PAUSED
    type: string
    x-enum-varnames:
    - CampaignStatusDraft
    - CampaignStatusScheduled
    - CampaignStatusSending
    - CampaignStatusCompleted
    - CampaignStatusFailed
    - CampaignStatusPaused
  kori_internal_models.Contact:
    properties:
      address:
        type: string
      city:
        type: string
      company:
        type: string
      country:
        type: string
      createdAt:
        type: string
      email:
        type: string
      facebook:
        type: string
      firstName:
        minLength: 2
        type: string
      id:
        type: string
      import:
        $ref: '#/definitions/kori_internal_models.ContactImport'
      importId:
        type: string
      instagram:
        type: string
      isDeleted:
        default: false
        type: boolean
      lastName:
        minLength: 2
        type: string
      lifecycleStage:
        type: string
      linkedin:
        type: string
      list:
        $ref: '#/definitions/kori_internal_models.MailingList'
      listId:
        type: string
      metadata:
        items:
          type: integer
        type: array
      phone:
        type: string
      state:
        type: string
      status:
        allOf:
        - $ref: '#/definitions/kori_internal_models.SubscriberStatus'
        enum:
        - ACTIVE
        - UNSUBSCRIBED
        - BOUNCED
        - COMPLAINED
        - INACTIVE
      tags:
        items:
          $ref: '#/definitions/kori_internal_models.Tag'
        type: array
      teamId:
        type: string
      timezone:
        description: IANA name; automations send in it
        type: string
      twitter:
        type: string
      updatedAt:
        type: string
      zip:
        type: string
    required:
    - email
    - listId
    - status
    - teamId
    type: object
  kori_internal_models.ContactImport:
    properties:
      contacts:
        items:
          $ref: '#/definitions/kori_internal_models.Contact'
        type: array
      createdAt:
        type: string
      fieldsMap:
        items:
          type: integer
        type: array
      file:
        $ref: '#/definitions/kori_internal_models.File'
      fileId:
        type: string
      id:
        type: string
      isDeleted:
        default: false
        type: boolean
      list:
        $ref: '#/definitions/kori_internal_models.MailingList'
      listId:
        type: string
      skipped:
        description: rows left out, counted by reason
        items:
          type: integer
        type: array
      status:
        allOf:
        - $ref: '#/definitions/kori_internal_models.ContactImportStatus'
        enum:
        - PENDING
        - PROCESSING
        - COMPLETED
        - FAILED
      team:
        $ref: '#/definitions/kori_internal_models.Team'
      teamId:
        type: string
      updatedAt:
        type: string
    required:
    - fieldsMap
    - listId
    - status
    - teamId
    type: object
  kori_internal_models.ContactImportStatus:
    enum:
    - PENDING
    - COMPLETED
    - FAILED
    type: string
    x-enum-varnames:
    - ContactImportStatusPending
    - ContactImportStatusCompleted
    - ContactImportStatusFailed
  kori_internal_models.Delivery:
    properties:
      createdAt:
        type: string
      error:
        type: string
      event:
        enum:
        - click
        - open
        - reply
        - bounce
        - complaint
        - sent
        - delivered
        - unsubscribed
        - failed
        type: string
