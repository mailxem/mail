# DO NOT commit actual values - apply manually with kubectl
# To apply: kubectl apply -f xemapp-secrets.yaml -n posthoot
---
apiVersion: v1
kind: Secret
metadata:
  name: xemapp-secrets
  namespace: posthoot
type: Opaque
stringData:
  google-client-id: "REPLACE_WITH_GOOGLE_CLIENT_ID"
  google-client-secret: "REPLACE_WITH_GOOGLE_CLIENT_SECRET"
  jwt-secret: "REPLACE_WITH_JWT_SECRET"
  nextauth-secret: "REPLACE_WITH_NEXTAUTH_SECRET"
