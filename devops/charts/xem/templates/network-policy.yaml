{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "xem.name" . }}-http
spec:
  podSelector:
    matchLabels:
      {{- include "xem.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {{ toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 12 }}
        - podSelector:
            matchLabels:
              {{- include "xem.selector" . | nindent 14 }}
      ports:
        - {port: http, protocol: TCP}
{{- if .Values.managedSending.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "xem.name" . }}-smtp
spec:
  podSelector:
    matchLabels:
      {{- include "xem.selector" . | nindent 6 }}
      app.kubernetes.io/component: backend
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {port: smtp, protocol: TCP}
{{- end }}
{{- end }}
