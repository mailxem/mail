name: Backend CI

on:
  pull_request:
    paths: ['server/**', 'devops/cloudflare-mailbox/test/fixtures/**', '.github/workflows/backend-ci.yml']
  workflow_call:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    working-directory: server

env:
  GO_VERSION: '1.24'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🐹 Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: server/go.sum

      - name: 📦 Download dependencies
        run: go mod download

      - name: ✅ Verify dependencies
        run: go mod verify

      - name: 🔍 Run go vet
        run: go vet ./...

      - name: 🧪 Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: 📊 Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./server/coverage.out
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🐹 Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: server/go.sum

      - name: 🏗️ Build main binary
        run: |
          go build -v -trimpath -ldflags="-s -w" -o bin/posthoot cmd/main.go

      - name: 🏗️ Build helper binary
        run: |
          go build -v -trimpath -ldflags="-s -w" -o bin/helper cmd/helper/main.go

      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-binaries
          path: server/bin/
          retention-days: 7
