name: Backend EKS deployment (optional)

on:
  workflow_dispatch:
permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: posthoot
  EKS_CLUSTER: posthoot-prod

jobs:
  build-and-deploy:
    if: vars.EKS_DEPLOY_ENABLED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: production
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push image to ECR
      uses: docker/build-push-action@v6
      with:
        context: server
        push: true
        platforms: linux/amd64
        tags: |
          ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
        cache-from: type=gha,scope=eks-amd64
        cache-to: type=gha,mode=max,scope=eks-amd64

    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER"

    - name: Deploy to EKS
      id: deploy
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        # Update image in deployment
        kubectl set image deployment/posthoot \
          "posthoot=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
          -n posthoot

        # Wait for rollout
        kubectl rollout status deployment/posthoot -n posthoot --timeout=5m

        # Verify deployment
        kubectl get pods -n posthoot

    - name: Verify health
      run: |
        # Get ALB endpoint
        ALB=$(kubectl get ingress posthoot-ingress -n posthoot -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')

        # Wait for health check
        for i in {1..30}; do
          if curl -f "http://$ALB/health"; then
            echo "Health check passed"
            exit 0
          fi
          echo "Waiting for health check... ($i/30)"
          sleep 10
        done

        echo "Health check failed"
        exit 1

    - name: Rollback on failure
      if: failure() && steps.deploy.outcome == 'failure'
      run: |
        kubectl rollout undo deployment/posthoot -n posthoot
        kubectl rollout status deployment/posthoot -n posthoot
