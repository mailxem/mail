name: backend release
on:
  push:
    branches: [undefined]
    paths: ['server/**', '.github/workflows/backend-release.yml', '.github/workflows/backend-ci.yml', '.github/workflows/component-release.yml', 'scripts/component-release.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-pipeline-backend-${{ github.ref }}
  queue: max
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/backend-ci.yml
  release:
    needs: validate
    uses: ./.github/workflows/component-release.yml
    with:
      component: backend
      directory: server
      image: theboringhumane/xemgo
    secrets:
      DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
  deploy:
    needs: release
    uses: ./.github/workflows/hakopod-deploy.yml
    with:
      service: backend
      image: ${{ needs.release.outputs.image }}
    secrets:
      HAKOPOD_API_TOKEN: ${{ secrets.HAKOPOD_API_TOKEN }}
