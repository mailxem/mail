name: Monorepo checks
on:
  pull_request:
    paths: ['.github/**', '**/.github/**', 'scripts/**', 'migration/**', '.gitmodules']
  push:
    branches: [undefined]
    paths: ['.github/**', '**/.github/**', 'scripts/**', 'migration/**', '.gitmodules']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      # GitHub supports concurrency.queue, but actionlint v1.7.7 predates it.
      - run: '"$(go env GOPATH)/bin/actionlint" -ignore ''unexpected key "queue" for "concurrency" section'''
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Assert centralized repository layout
        run: python3 scripts/check-repository-layout.py
  registry-credential:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # No checkout or PR-authored scripts run in this job. Validate login only.
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME || 'theboringhumane' }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
