name: Monorepo checks
on:
  pull_request:
    paths: ['.github/**', 'scripts/**', 'migration/**', '.gitmodules']
  push:
    branches: [undefined]
    paths: ['.github/**', 'scripts/**', 'migration/**', '.gitmodules']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - run: '"$(go env GOPATH)/bin/actionlint"'
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Assert ordinary directories
        run: |
          test ! -f .gitmodules
          if git ls-files --stage | grep -q '^160000 '; then
            echo 'Git submodules must not be introduced into the monorepo'
            exit 1
          fi
  registry-credential:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # No checkout or PR-authored scripts run in this job. Validate login only.
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME || 'theboringhumane' }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
