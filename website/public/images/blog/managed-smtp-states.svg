<svg xmlns="http://www.w3.org/2000/svg" width="640" height="870" viewBox="0 0 640 870" role="img" aria-labelledby="title desc"><title id="title">A status is a promise. Keep it precise.</title><desc id="desc">Queued proves database acceptance, accepted proves SES acceptance, delivered proves recipient-server acceptance. Inbox placement and reading are not proved by these events.</desc><rect x="0" y="0" width="640" height="870" rx="18" fill="#eef0e7" stroke="none" stroke-width="2"/><text x="36" y="48" font-family="Arial, sans-serif" font-size="17" fill="#164b3f">03 / WHAT THE STATUS TELLS YOU</text><text x="36" y="96" font-family="Georgia, serif" font-size="36" fill="#22251f">Three signals. No guesswork.</text><path d="M66 162L66 585" fill="none" stroke="#164b3f" stroke-width="3"/><circle cx="66" cy="171" r="22" fill="#164b3f"/><text x="59" y="179" font-family="Arial, sans-serif" font-size="24" fill="#ffffef">1</text><text x="112" y="162" font-family="Arial, sans-serif" font-size="18" fill="#164b3f">QUEUED</text><text x="112" y="204" font-family="Georgia, serif" font-size="27" fill="#22251f">Xem stored the message.</text><text x="112" y="241" font-family="Arial, sans-serif" font-size="21" fill="#5c655b">SMTP acceptance follows the DB commit.</text><circle cx="66" cy="336" r="22" fill="#164b3f"/><text x="59" y="344" font-family="Arial, sans-serif" font-size="24" fill="#ffffef">2</text><text x="112" y="327" font-family="Arial, sans-serif" font-size="18" fill="#164b3f">ACCEPTED</text><text x="112" y="369" font-family="Georgia, serif" font-size="27" fill="#22251f">SES accepted the submission.</text><text x="112" y="406" font-family="Arial, sans-serif" font-size="21" fill="#5c655b">Delivery is still a separate event.</text><circle cx="66" cy="501" r="22" fill="#164b3f"/><text x="59" y="509" font-family="Arial, sans-serif" font-size="24" fill="#ffffef">3</text><text x="112" y="492" font-family="Arial, sans-serif" font-size="18" fill="#164b3f">DELIVERED</text><text x="112" y="534" font-family="Georgia, serif" font-size="27" fill="#22251f">The recipient server accepted it.</text><text x="112" y="571" font-family="Arial, sans-serif" font-size="21" fill="#5c655b">Based on authenticated SES feedback.</text><rect x="36" y="650" width="568" height="162" rx="20" fill="#e7d8fa" stroke="#5b3cc4" stroke-width="2"/><text x="60" y="687" font-family="Arial, sans-serif" font-size="17" fill="#5b3cc4">NOT PROVED BY THESE EVENTS</text><text x="60" y="734" font-family="Georgia, serif" font-size="29" fill="#22251f">Inbox placement. Human attention.</text><text x="60" y="776" font-family="Arial, sans-serif" font-size="23" fill="#22251f">A delivery event cannot tell you either.</text><text x="36" y="847" font-family="Arial, sans-serif" font-size="19" fill="#5c655b">Illustrative states · not a conversion-rate chart</text></svg>