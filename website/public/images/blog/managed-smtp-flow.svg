<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1020" viewBox="0 0 640 1020" role="img" aria-labelledby="title desc"><title id="title">One message. A path you can inspect.</title><desc id="desc">Campaigns and SMTP clients pass Xem checks, enter PostgreSQL, and go to SES and the recipient server. SES events return through SNS to delivery history and suppression.</desc><rect x="0" y="0" width="640" height="1020" rx="18" fill="#eef0e7" stroke="none" stroke-width="2"/><text x="36" y="48" font-family="Arial, sans-serif" font-size="17" fill="#164b3f">02 / THE DELIVERY PATH</text><text x="36" y="96" font-family="Georgia, serif" font-size="36" fill="#22251f">One message. A clear path.</text><rect x="116" y="128" width="488" height="102" rx="18" fill="#ffffef" stroke="#164b3f" stroke-width="2"/><text x="137" y="163" font-family="Arial, sans-serif" font-size="16" fill="#164b3f">01</text><text x="175" y="167" font-family="Arial, sans-serif" font-size="27" fill="#22251f">Campaign or SMTP client</text><text x="137" y="205" font-family="Arial, sans-serif" font-size="22" fill="#5c655b">Your content, your verified sender</text><path d="M360 230v28m-7-8 7 8 7-8" fill="none" stroke="#164b3f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="116" y="268" width="488" height="102" rx="18" fill="#ffffef" stroke="#164b3f" stroke-width="2"/><text x="137" y="303" font-family="Arial, sans-serif" font-size="16" fill="#164b3f">02</text><text x="175" y="307" font-family="Arial, sans-serif" font-size="27" fill="#22251f">Xem policy checks</text><text x="137" y="345" font-family="Arial, sans-serif" font-size="22" fill="#5c655b">Workspace · domain · limits</text><path d="M360 370v28m-7-8 7 8 7-8" fill="none" stroke="#164b3f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="116" y="408" width="488" height="102" rx="18" fill="#edf09b" stroke="#164b3f" stroke-width="2"/><text x="137" y="443" font-family="Arial, sans-serif" font-size="16" fill="#164b3f">03</text><text x="175" y="447" font-family="Arial, sans-serif" font-size="27" fill="#22251f">PostgreSQL outbox</text><text x="137" y="485" font-family="Arial, sans-serif" font-size="22" fill="#5c655b">Store first. Then acknowledge.</text><path d="M360 510v28m-7-8 7 8 7-8" fill="none" stroke="#164b3f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="116" y="548" width="488" height="102" rx="18" fill="#e7d8fa" stroke="#164b3f" stroke-width="2"/><text x="137" y="583" font-family="Arial, sans-serif" font-size="16" fill="#164b3f">04</text><text x="175" y="587" font-family="Arial, sans-serif" font-size="27" fill="#22251f">Amazon SES API</text><text x="137" y="625" font-family="Arial, sans-serif" font-size="22" fill="#5c655b">The delivery infrastructure</text><path d="M360 650v28m-7-8 7 8 7-8" fill="none" stroke="#164b3f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="116" y="688" width="488" height="102" rx="18" fill="#ffffef" stroke="#164b3f" stroke-width="2"/><text x="137" y="723" font-family="Arial, sans-serif" font-size="16" fill="#164b3f">05</text><text x="175" y="727" font-family="Arial, sans-serif" font-size="27" fill="#22251f">Recipient mail server</text><text x="137" y="765" font-family="Arial, sans-serif" font-size="22" fill="#5c655b">Acceptance ≠ inbox placement</text><path d="M116 599H63V883H116m-9-7 9 7-9 7" fill="none" stroke="#5b3cc4" stroke-width="3" stroke-dasharray="7 6"/><rect x="116" y="820" width="488" height="126" rx="18" fill="#5b3cc4" stroke="none" stroke-width="2"/><text x="138" y="859" font-family="Arial, sans-serif" font-size="26" fill="#ffffef">SES events → Amazon SNS</text><text x="138" y="899" font-family="Arial, sans-serif" font-size="22" fill="#ffffef">Verify signatures. Record outcomes.</text><text x="138" y="929" font-family="Arial, sans-serif" font-size="22" fill="#ffffef">Update suppression before later sends.</text><text x="36" y="984" font-family="Arial, sans-serif" font-size="19" fill="#5c655b">Illustrative architecture · not measured traffic</text></svg>