<svg xmlns="http://www.w3.org/2000/svg" width="640" height="840" viewBox="0 0 640 840" role="img" aria-labelledby="title desc"><title id="title">One brand. Three different jobs.</title><desc id="desc">The From address is visible to readers. A dedicated bounce subdomain uses SES MAIL FROM records. Replies and the existing receiving MX stay with the mailbox provider.</desc><rect x="0" y="0" width="640" height="840" rx="18" fill="#eee8f5" stroke="none" stroke-width="2"/><text x="36" y="48" font-family="Arial, sans-serif" font-size="17" fill="#164b3f">01 / YOUR DOMAIN</text><text x="36" y="96" font-family="Georgia, serif" font-size="36" fill="#22251f">One brand. Three different jobs.</text><rect x="36" y="130" width="568" height="170" rx="22" fill="#ffffef" stroke="none" stroke-width="2"/><text x="60" y="166" font-family="Arial, sans-serif" font-size="17" fill="#5b3cc4">WHAT READERS SEE</text><text x="60" y="215" font-family="Georgia, serif" font-size="34" fill="#22251f">hello@example.com</text><text x="60" y="255" font-family="Arial, sans-serif" font-size="25" fill="#22251f">Your visible From address.</text><text x="60" y="284" font-family="Arial, sans-serif" font-size="22" fill="#5c655b">DKIM + DMARC help authenticate it.</text><rect x="36" y="330" width="568" height="170" rx="22" fill="#ffffef" stroke="none" stroke-width="2"/><text x="60" y="366" font-family="Arial, sans-serif" font-size="17" fill="#5b3cc4">WHERE DELIVERY FAILURES GO</text><text x="60" y="415" font-family="Georgia, serif" font-size="34" fill="#22251f">bounce.example.com</text><text x="60" y="455" font-family="Arial, sans-serif" font-size="25" fill="#22251f">Dedicated custom MAIL FROM domain.</text><text x="60" y="484" font-family="Arial, sans-serif" font-size="22" fill="#5c655b">SES MX + SPF live on this subdomain.</text><rect x="36" y="530" width="568" height="170" rx="22" fill="#164b3f" stroke="none" stroke-width="2"/><text x="60" y="566" font-family="Arial, sans-serif" font-size="17" fill="#edf09b">WHERE THE CONVERSATION CONTINUES</text><text x="60" y="615" font-family="Georgia, serif" font-size="34" fill="#ffffef">Your existing mailbox</text><text x="60" y="655" font-family="Arial, sans-serif" font-size="25" fill="#ffffef">Keep your receiving MX records.</text><text x="60" y="684" font-family="Arial, sans-serif" font-size="22" fill="#ffffef">Replies follow your Reply-To address.</text><text x="36" y="757" font-family="Arial, sans-serif" font-size="24" fill="#22251f">SMTP host = where a tool submits mail.</text><text x="36" y="794" font-family="Arial, sans-serif" font-size="22" fill="#5c655b">It does not have to match your From domain.</text></svg>